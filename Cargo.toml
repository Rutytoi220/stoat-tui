[package]
name = "stoat-tui"
version = "0.1.0"
edition = "2021"
default-run = "stoat-tui"
description = "A fast, keyboard-first, and fully mouse-accessible Terminal User Interface client for Stoat"
license = "MIT"
repository = "https://github.com/stoat-chat/stoat-tui"
keywords = ["stoat", "revolt", "tui", "chat", "terminal"]
categories = ["command-line-utilities"]

[lib]
name = "stoat_tui"
path = "src/lib.rs"

[[bin]]
name = "stoat-tui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
unicode-width = "0.2"
fuzzy-matcher = "0.3"
url = "2.5"
cpal = "0.18.2"
image = { version = "0.25.10", features = ["png", "jpeg", "webp", "gif"] }
livekit = { version = "0.11.0", features = ["rustls-tls-webpki-roots"] }
ratatui-image = { version = "11.1.0", features = ["crossterm"], default-features = false }
rfd = "0.18.0"
ashpd = { version = "0.14", features = ["screencast"] }
pipewire = "0.10"
