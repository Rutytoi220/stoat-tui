[package]
name = "stoat-tui"
version = "0.1.0"
edition = "2021"
default-run = "stoat-tui"
description = "A fast, keyboard-first, and fully mouse-accessible Terminal User Interface client for Stoat"
license = "MIT"
repository = "https://github.com/stoat-chat/stoat-tui"
keywords = ["stoat", "revolt", "tui", "chat", "terminal"]
categories = ["command-line-utilities"]

[lib]
name = "stoat_tui"
path = "src/lib.rs"

[[bin]]
name = "stoat-tui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
unicode-width = "0.2"
fuzzy-matcher = "0.3"
