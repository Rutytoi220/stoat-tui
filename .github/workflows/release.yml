name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt_packages: libasound2-dev pkg-config libssl-dev libgtk-3-dev
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.apt_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="stoat-tui-${TAG}-${{ matrix.target }}"
          STAGE_DIR="target/package/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"

          cp "target/${{ matrix.target }}/release/stoat-tui" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"

          tar -czvf "target/${ARCHIVE_NAME}.tar.gz" -C "target/package" "${ARCHIVE_NAME}"
          cd target
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            target/*.tar.gz
            target/*.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate Checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
